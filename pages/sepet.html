<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sepetim - SulamaShop</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#1B5E20">
    <link rel="stylesheet" href="../css/style.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">

    <!-- Google Analytics - G-XXXXXXXXXX yerine kendi Measurement ID'nizi yazin -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-XXXXXXXXXX');</script>
</head>
<body>
    <div class="top-bar"><div class="container"><span>✧ Türkiye geneli ücretsiz kargo | 500 TL üzeri siparişlerde ✧</span></div></div>
    <header class="header">
        <div class="container">
            <div class="header-inner">
                <a href="../index.html" class="logo">
                    <span class="logo-icon"><svg viewBox="0 0 32 32" width="26" height="26" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M16 3C16 3 7 15 7 22a9 9 0 0018 0C25 15 16 3 16 3z" stroke="currentColor" stroke-width="2" fill="currentColor" fill-opacity="0.15"/><path d="M13 18c0-2 3-6 3-6s3 4 3 6a3 3 0 01-6 0z" fill="currentColor" opacity="0.3"/><circle cx="12" cy="23" r="1.5" fill="currentColor" opacity="0.25"/></svg></span>
                    <span class="logo-text">Sulama<strong>Shop</strong></span>
                </a>
                <nav class="nav" id="mainNav">
                    <a href="../index.html" class="nav-link">Ana Sayfa</a>
                    <a href="urunler.html" class="nav-link">Ürünler</a>
                    <a href="hakkimizda.html" class="nav-link">Hakkımızda</a>
                    <a href="iletisim.html" class="nav-link">İletişim</a>
                </nav>
                <div class="header-actions">
                    <button class="cart-btn" id="cartBtn">
                        <span class="cart-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg></span>
                        <span class="cart-count" id="cartCount">0</span>
                    </button>
                    <button class="mobile-menu-btn" id="mobileMenuBtn"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
                </div>
            </div>
        </div>
    </header>

    <div class="breadcrumb">
        <div class="container">
            <a href="../index.html">Ana Sayfa</a> / <span>Sepetim</span>
        </div>
    </div>

    <section class="cart-page">
        <div class="container">
            <h1>Sepetim</h1>
            <div class="cart-page-layout" id="cartPageContent">
                <div class="cart-page-items" id="cartPageItems">
                    <p class="cart-empty-page">Sepetinizde ürün bulunmamaktadır.</p>
                </div>
                <div class="cart-page-summary" id="cartPageSummary" style="display:none;">
                    <h3>Sipariş Özeti</h3>
                    <div class="summary-row">
                        <span>Ara Toplam</span>
                        <span id="subtotal">0 TL</span>
                    </div>
                    <div class="summary-row">
                        <span>Kargo</span>
                        <span id="shipping">0 TL</span>
                    </div>
                    <div class="summary-row total">
                        <span>Toplam</span>
                        <strong id="totalAmount">0 TL</strong>
                    </div>
                    <button class="btn btn-primary btn-block" id="checkoutBtn">Siparişi Tamamla</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Checkout Modal -->
    <div class="modal" id="checkoutModal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <h2>Sipariş Bilgileri</h2>
            <form id="checkoutForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Ad Soyad</label>
                        <input type="text" required>
                    </div>
                    <div class="form-group">
                        <label>Telefon</label>
                        <input type="tel" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>E-posta</label>
                    <input type="email" required>
                </div>
                <div class="form-group">
                    <label>Adres</label>
                    <textarea rows="3" required></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>İl</label>
                        <input type="text" required>
                    </div>
                    <div class="form-group">
                        <label>İlçe</label>
                        <input type="text" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Siparişi Onayla</button>
            </form>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 SulamaShop. Tüm hakları saklıdır.</p>
            </div>
        </div>
    </footer>

    <script src="../js/products.min.js" defer></script>
    <script src="../js/cart.min.js" defer></script>
    <script src="../js/app.min.js" defer></script>
</body>
</html>

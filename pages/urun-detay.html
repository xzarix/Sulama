<!DOCTYPE html>

    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#1B5E20">

<body>
    <!-- Header -->
    <div class="top-bar"><div class="container"><span>✧ Türkiye geneli ücretsiz kargo | 500 TL üzeri siparişlerde ✧</span></div></div>
    <header class="header">
        <div class="container">
            <div class="header-inner">
                <a href="../index.html" class="logo">
                    <span class="logo-icon"><svg viewBox="0 0 32 32" width="26" height="26" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M16 3C16 3 7 15 7 22a9 9 0 0018 0C25 15 16 3 16 3z" stroke="currentColor" stroke-width="2" fill="currentColor" fill-opacity="0.15"/><path d="M13 18c0-2 3-6 3-6s3 4 3 6a3 3 0 01-6 0z" fill="currentColor" opacity="0.3"/><circle cx="12" cy="23" r="1.5" fill="currentColor" opacity="0.25"/></svg></span>

                <nav class="nav" id="mainNav">
                    <a href="../index.html" class="nav-link">Ana Sayfa</a>
                    <a href="urunler.html" class="nav-link active">Ürünler</a>
                    <a href="hakkimizda.html" class="nav-link">Hakkımızda</a>
                    <a href="iletisim.html" class="nav-link">İletişim</a>
                </nav>
                <div class="header-actions">
                    <button class="cart-btn" id="cartBtn">
                        <span class="cart-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg></span>
                        <span class="cart-count" id="cartCount">0</span>
                    </button>
                    <button class="mobile-menu-btn" id="mobileMenuBtn"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
                </div>
            </div>
        </div>

    <!-- Breadcrumb -->
    <div class="breadcrumb">
        <div class="container">
            <a href="../index.html">Ana Sayfa</a> / <a href="urunler.html">Ürünler</a> / <span id="breadcrumbProduct">Ürün</span>
        </div>
    </div>

    <!-- Product Detail -->
    <section class="product-detail">
        <div class="container">
            <div class="product-detail-grid" id="productDetail">
                <!-- Loaded by JS -->
            </div>
        </div>
    </section>

    <!-- Related Products -->
    <section class="related-products">
        <div class="container">
            <h2 class="section-title">Benzer Ürünler</h2>
            <div class="product-grid" id="relatedProducts"></div>
        </div>
    </section>

    <!-- Cart Sidebar -->
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h3>Sepetim</h3>
            <button class="cart-close" id="cartClose">&times;</button>
        </div>
        <div class="cart-items" id="cartItems">
            <p class="cart-empty">Sepetiniz boş</p>
        </div>
        <div class="cart-footer" id="cartFooter" style="display:none;">
            <div class="cart-total">
                <span>Toplam:</span>
                <strong id="cartTotal">0 TL</strong>
            </div>
            <a href="sepet.html" class="btn btn-primary btn-block">Sepete Git</a>
        </div>

    <div class="cart-overlay" id="cartOverlay"></div>

    <footer class="footer">

            <div class="footer-bottom">

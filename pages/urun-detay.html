<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ürün Detay - SulamaShop</title>
    <meta name="robots" content="noindex, follow">
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-inner">
                <a href="../index.html" class="logo">
                    <span class="logo-icon">💧</span>
                    <span class="logo-text">Sulama<strong>Shop</strong></span>
                </a>
                <nav class="nav" id="mainNav">
                    <a href="../index.html" class="nav-link">Ana Sayfa</a>
                    <a href="urunler.html" class="nav-link active">Ürünler</a>
                    <a href="hakkimizda.html" class="nav-link">Hakkımızda</a>
                    <a href="iletisim.html" class="nav-link">İletişim</a>
                </nav>
                <div class="header-actions">
                    <button class="cart-btn" id="cartBtn">
                        <span class="cart-icon">🛒</span>
                        <span class="cart-count" id="cartCount">0</span>
                    </button>
                    <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Breadcrumb -->
    <div class="breadcrumb">
        <div class="container">
            <a href="../index.html">Ana Sayfa</a> / <a href="urunler.html">Ürünler</a> / <span id="breadcrumbProduct">Ürün</span>
        </div>
    </div>

    <!-- Product Detail -->
    <section class="product-detail">
        <div class="container">
            <div class="product-detail-grid" id="productDetail">
                <!-- Loaded by JS -->
            </div>
        </div>
    </section>

    <!-- Related Products -->
    <section class="related-products">
        <div class="container">
            <h2 class="section-title">Benzer Ürünler</h2>
            <div class="product-grid" id="relatedProducts"></div>
        </div>
    </section>

    <!-- Cart Sidebar -->
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h3>Sepetim</h3>
            <button class="cart-close" id="cartClose">&times;</button>
        </div>
        <div class="cart-items" id="cartItems">
            <p class="cart-empty">Sepetiniz boş</p>
        </div>
        <div class="cart-footer" id="cartFooter" style="display:none;">
            <div class="cart-total">
                <span>Toplam:</span>
                <strong id="cartTotal">0 TL</strong>
            </div>
            <a href="sepet.html" class="btn btn-primary btn-block">Sepete Git</a>
        </div>
    </div>
    <div class="cart-overlay" id="cartOverlay"></div>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 SulamaShop. Tüm hakları saklıdır.</p>
            </div>
        </div>
    </footer>

    <script src="../js/products.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>

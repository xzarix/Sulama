<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SulamaShop Admin Panel</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f5f5f5; color: #333; }
        .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); width: 360px; text-align: center; }
        .login-box h2 { margin-bottom: 24px; color: #2e7d32; }
        .login-box input { width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
        .login-box button { width: 100%; padding: 12px; background: #2e7d32; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .login-box button:hover { background: #1b5e20; }
        .login-error { color: #d32f2f; font-size: 13px; margin-bottom: 12px; display: none; }

        .admin { display: none; }
        .admin-header { background: #2e7d32; color: white; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        .admin-header h1 { font-size: 20px; }
        .admin-header button { background: rgba(255,255,255,0.2); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }

        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; padding: 24px; }
        .stat-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .stat-card .label { font-size: 13px; color: #777; margin-bottom: 4px; }
        .stat-card .value { font-size: 28px; font-weight: 700; color: #2e7d32; }

        .tabs { display: flex; gap: 0; padding: 0 24px; border-bottom: 2px solid #e0e0e0; }
        .tab { padding: 12px 24px; cursor: pointer; font-weight: 500; color: #777; border-bottom: 2px solid transparent; margin-bottom: -2px; }
        .tab.active { color: #2e7d32; border-bottom-color: #2e7d32; }

        .content { padding: 24px; }
        .section { display: none; }
        .section.active { display: block; }

        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        th { background: #f5f5f5; text-align: left; padding: 12px 16px; font-size: 13px; color: #555; font-weight: 600; }
        td { padding: 12px 16px; border-top: 1px solid #eee; font-size: 13px; }
        tr:hover td { background: #fafafa; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
        .badge-new { background: #e8f5e9; color: #2e7d32; }
        .empty { text-align: center; padding: 40px; color: #999; }
        .order-detail { max-width: 300px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h2>SulamaShop Admin</h2>
            <div class="login-error" id="loginError">Yanlis sifre. Tekrar deneyin.</div>
            <input type="password" id="passwordInput" placeholder="Admin sifresi" autofocus>
            <button onclick="login()">Giris Yap</button>
        </div>
    </div>

    <!-- Admin Panel -->
    <div class="admin" id="adminPanel">
        <div class="admin-header">
            <h1>SulamaShop Admin Panel</h1>
            <button onclick="logout()">Cikis</button>
        </div>

        <div class="stats" id="statsCards"></div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('orders')">Siparisler</div>
            <div class="tab" onclick="switchTab('messages')">Mesajlar</div>
            <div class="tab" onclick="switchTab('subscribers')">Aboneler</div>
        </div>

        <div class="content">
            <div class="section active" id="section-orders"></div>
            <div class="section" id="section-messages"></div>
            <div class="section" id="section-subscribers"></div>
        </div>
    </div>

    <script>
    let adminPassword = '';

    function login() {
        const pw = document.getElementById('passwordInput').value;
        if (!pw) return;
        adminPassword = pw;
        fetch('/api/admin/stats?password=' + encodeURIComponent(pw))
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('adminPanel').style.display = 'block';
                    loadStats(data.stats);
                    loadOrders();
                    loadMessages();
                    loadSubscribers();
                } else {
                    document.getElementById('loginError').style.display = 'block';
                }
            })
            .catch(() => {
                document.getElementById('loginError').textContent = 'Sunucu baglantisi kurulamadi.';
                document.getElementById('loginError').style.display = 'block';
            });
    }

    document.getElementById('passwordInput').addEventListener('keypress', e => {
        if (e.key === 'Enter') login();
    });

    function logout() {
        adminPassword = '';
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('adminPanel').style.display = 'none';
        document.getElementById('passwordInput').value = '';
    }

    function api(endpoint) {
        return fetch('/api/admin/' + endpoint + '?password=' + encodeURIComponent(adminPassword))
            .then(r => r.json());
    }

    function loadStats(stats) {
        document.getElementById('statsCards').innerHTML = `
            <div class="stat-card"><div class="label">Siparisler</div><div class="value">${stats.orders}</div></div>
            <div class="stat-card"><div class="label">Mesajlar</div><div class="value">${stats.messages}</div></div>
            <div class="stat-card"><div class="label">Aboneler</div><div class="value">${stats.subscribers}</div></div>
            <div class="stat-card"><div class="label">Toplam Ciro</div><div class="value">${parseFloat(stats.totalRevenue).toLocaleString('tr-TR')} TL</div></div>
        `;
    }

    function formatDate(iso) {
        if (!iso) return '-';
        const d = new Date(iso);
        return d.toLocaleDateString('tr-TR') + ' ' + d.toLocaleTimeString('tr-TR', {hour:'2-digit',minute:'2-digit'});
    }

    function loadOrders() {
        api('orders').then(data => {
            if (!data.data || data.data.length === 0) {
                document.getElementById('section-orders').innerHTML = '<div class="empty">Henuz siparis yok</div>';
                return;
            }
            const rows = data.data.map(o => `
                <tr>
                    <td><strong>${o.id || '-'}</strong></td>
                    <td>${formatDate(o.date)}</td>
                    <td>${o.customer?.name || '-'}<br><small>${o.customer?.phone || ''}</small></td>
                    <td class="order-detail">${(o.cart || []).map(i => i.name + ' x' + i.quantity).join(', ')}</td>
                    <td><strong>${o.total} TL</strong></td>
                    <td><span class="badge badge-new">${o.status || 'yeni'}</span></td>
                </tr>
            `).join('');
            document.getElementById('section-orders').innerHTML = `
                <table><thead><tr><th>Siparis No</th><th>Tarih</th><th>Musteri</th><th>Urunler</th><th>Toplam</th><th>Durum</th></tr></thead><tbody>${rows}</tbody></table>
            `;
        });
    }

    function loadMessages() {
        api('messages').then(data => {
            if (!data.data || data.data.length === 0) {
                document.getElementById('section-messages').innerHTML = '<div class="empty">Henuz mesaj yok</div>';
                return;
            }
            const rows = data.data.map(m => `
                <tr>
                    <td>${formatDate(m.date)}</td>
                    <td>${m.name || '-'}</td>
                    <td>${m.email || '-'}<br><small>${m.phone || ''}</small></td>
                    <td><strong>${m.subject || '-'}</strong></td>
                    <td style="max-width:300px;">${m.message || '-'}</td>
                </tr>
            `).join('');
            document.getElementById('section-messages').innerHTML = `
                <table><thead><tr><th>Tarih</th><th>Ad</th><th>Iletisim</th><th>Konu</th><th>Mesaj</th></tr></thead><tbody>${rows}</tbody></table>
            `;
        });
    }

    function loadSubscribers() {
        api('subscribers').then(data => {
            if (!data.data || data.data.length === 0) {
                document.getElementById('section-subscribers').innerHTML = '<div class="empty">Henuz abone yok</div>';
                return;
            }
            const rows = data.data.map(s => `
                <tr><td>${formatDate(s.date)}</td><td>${s.email || '-'}</td></tr>
            `).join('');
            document.getElementById('section-subscribers').innerHTML = `
                <table><thead><tr><th>Tarih</th><th>E-posta</th></tr></thead><tbody>${rows}</tbody></table>
            `;
        });
    }

    function switchTab(name) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('section-' + name).classList.add('active');
    }
    </script>
</body>
</html>
